[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "drf-parcel"
version = "0.1.0.dev0"
description = "One response shape for a Django REST framework API - success, page and error alike."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "amir mohammad kashanchian" }]
requires-python = ">=3.11"
dependencies = ["Django>=5.2", "djangorestframework>=3.16"]
keywords = ["django", "djangorestframework", "drf", "api", "response", "envelope", "pagination", "errors"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
schema = ["drf-spectacular>=0.28"]

[project.urls]
Repository = "https://github.com/amirAI-dot/drf-parcel"
Changelog = "https://github.com/amirAI-dot/drf-parcel/blob/main/CHANGELOG.md"
Contract = "https://github.com/amirAI-dot/drf-parcel/blob/main/docs/contract.md"

[dependency-groups]
test = [
    "pytest>=9",
    "pytest-django>=4.11",
    "pytest-cov>=7",
    "psycopg[binary]>=3.2",
]
lint = ["ruff>=0.15"]
types = [
    "mypy>=1.15",
    "django-stubs>=5.2",
    "djangorestframework-stubs>=3.16",
]
dev = [
    "nox>=2025.2.9",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "types" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/drf_parcel"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "example", "LICENSE", "README.md", "README.fa.md", "CHANGELOG.md", "CHANGELOG.fa.md"]

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.project.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["drf_parcel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Every line of the library is run by a test: a line no test runs fails the suite.
fail_under = 100

# ---------------------------------------------------------------- lint

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "example"]
# The documents' examples are prose, laid out for reading rather than formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "N",        # naming
    "UP",       # newer syntax for the oldest supported Python
    "B",        # likely bugs
    "C4",       # comprehensions
    "SIM",      # simplifications
    "RET",      # return statements
    "PIE",      # unnecessary statements
    "PT",       # pytest style
    "DJ",       # Django conventions
    "RUF",      # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# The example is written as a project writes it: Django's TestCase, and plain
# dictionaries on views.
"example/**" = ["PT009", "PT027", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["drf_parcel", "tests", "shop", "config"]

[tool.ruff.format]
quote-style = "single"

# ---------------------------------------------------------------- types

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.project.settings"
